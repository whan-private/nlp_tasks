<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 狼人杀 — Leaderboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1117; color: #c9d1d9; padding: 24px;
}
h1 { font-size: 24px; color: #f0c040; margin-bottom: 20px; }
h2 { font-size: 18px; color: #f0e6d0; margin-bottom: 12px; }
.card {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 20px; margin-bottom: 16px;
}
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.metric {
  background: #0d1117; border: 1px solid #21262d; border-radius: 6px;
  padding: 14px; text-align: center;
}
.metric .value { font-size: 28px; font-weight: 700; }
.metric .value.good { color: #7ee787; }
.metric .value.bad { color: #ff7b72; }
.metric .value.neutral { color: #58a6ff; }
.metric .label { font-size: 12px; color: #8b949e; margin-top: 4px; }

.bar-chart { display: flex; gap: 24px; align-items: flex-end; padding: 20px 0; justify-content: center; }
.bar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar {
  width: 80px; border-radius: 4px 4px 0 0;
  display: flex; align-items: flex-end; justify-content: center;
  padding-top: 8px; transition: height 0.3s;
  min-height: 30px;
}
.bar.village { background: #58a6ff; }
.bar.werewolf { background: #ff7b72; }
.bar .val { color: #fff; font-weight: 700; font-size: 14px; }
.bar-label { font-size: 13px; color: #8b949e; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #21262d; font-size: 13px; }
th { color: #8b949e; font-weight: 600; position: sticky; top: 0; background: #161b22; }
tr:hover { background: #1c2128; }
.village-row { border-left: 3px solid #58a6ff; }
.werewolf-row { border-left: 3px solid #ff7b72; }

#gameDetail { display: none; }
.back-btn {
  background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 16px;
}
.back-btn:hover { background: #30363d; }
.log-link { color: #58a6ff; text-decoration: none; font-size: 12px; }
.log-link:hover { text-decoration: underline; }

.last-updated { font-size: 12px; color: #484f58; margin-top: 8px; }
</style>
</head>
<body>
<h1>🏆 AI 狼人杀 — Leaderboard</h1>
<button class="back-btn" id="refreshBtn">🔄 刷新</button>

<div id="overview">
  <div class="card">
    <h2>📊 总览</h2>
    <div class="metrics" id="overviewMetrics"></div>
    <div class="bar-chart" id="winChart"></div>
    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <div class="card">
    <h2>📋 对局列表</h2>
    <table>
      <thead><tr>
        <th>对局ID</th><th>胜者</th><th>轮次</th><th>发言数</th><th>投票数</th><th>操作</th>
      </tr></thead>
      <tbody id="gameTableBody"></tbody>
    </table>
  </div>
</div>

<div id="gameDetail">
  <button class="back-btn" id="backBtn">← 返回列表</button>
  <div class="card">
    <h2 id="detailTitle">对局详情</h2>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const API = "/api";

document.addEventListener("DOMContentLoaded", () => {
  loadLeaderboard();
  document.getElementById("refreshBtn").onclick = loadLeaderboard;
  document.getElementById("backBtn").onclick = () => {
    document.getElementById("gameDetail").style.display = "none";
    document.getElementById("overview").style.display = "block";
  };
});

async function loadLeaderboard() {
  try {
    const lb = await fetch(`${API}/leaderboard`).then(r => r.json());
    renderOverview(lb);
    renderGameList(lb.games || []);
    document.getElementById("lastUpdated").textContent =
      `最后更新: ${new Date().toLocaleString()}`;
  } catch (e) {
    console.error("Failed to load leaderboard:", e);
  }
}

function renderOverview(lb) {
  const container = document.getElementById("overviewMetrics");
  container.innerHTML = `
    <div class="metric">
      <div class="value neutral">${lb.total_games || 0}</div>
      <div class="label">总对局数</div>
    </div>
    <div class="metric">
      <div class="value good">${lb.village_win_rate || 0}%</div>
      <div class="label">好人胜率 (${lb.village_wins || 0}胜)</div>
    </div>
    <div class="metric">
      <div class="value bad">${lb.werewolf_win_rate || 0}%</div>
      <div class="label">狼人胜率 (${lb.werewolf_wins || 0}胜)</div>
    </div>
    <div class="metric">
      <div class="value neutral">${lb.avg_rounds || 0}</div>
      <div class="label">平均轮次</div>
    </div>
    <div class="metric">
      <div class="value neutral">${lb.avg_speeches_per_game || 0}</div>
      <div class="label">平均发言数/局</div>
    </div>
    <div class="metric">
      <div class="value neutral">${lb.total_wolves_eliminated || 0}</div>
      <div class="label">狼人被放逐总数</div>
    </div>
  `;

  const chart = document.getElementById("winChart");
  const total = lb.total_games || 1;
  const vH = (lb.village_wins || 0) / total * 200;
  const wH = (lb.werewolf_wins || 0) / total * 200;
  chart.innerHTML = `
    <div class="bar-wrapper">
      <div class="bar village" style="height:${Math.max(vH, 30)}px">
        <span class="val">${lb.village_win_rate || 0}%</span>
      </div>
      <span class="bar-label">好人</span>
    </div>
    <div class="bar-wrapper">
      <div class="bar werewolf" style="height:${Math.max(wH, 30)}px">
        <span class="val">${lb.werewolf_win_rate || 0}%</span>
      </div>
      <span class="bar-label">狼人</span>
    </div>
  `;
}

function renderGameList(games) {
  const tbody = document.getElementById("gameTableBody");
  tbody.innerHTML = games.map(g => `
    <tr class="${g.winner}-row">
      <td>${g.game_id}</td>
      <td style="font-weight:600;color:${g.winner === 'village' ? '#58a6ff' : '#ff7b72'}">
        ${g.winner.toUpperCase()}
      </td>
      <td>${g.rounds}</td>
      <td>${g.total_speeches}</td>
      <td>${g.total_votes}</td>
      <td><a href="/api/games/${g.game_id}" target="_blank" class="log-link">📄 JSON</a></td>
    </tr>
  `).join("");
}
</script>
</body>
</html>
